    sol: 0
  - memory_id: mem_linruoxi_006
    type: semantic
    content: "CME 前兆光谱识别模型：日冕磁场扭曲模式、极紫外波段异常、太阳风质子通量梯度。我写的论文。如果有人读它，也许风暴前会有人像我当时一样犹豫。"
    emotional_intensity: 0.5
    event_type: professional_knowledge
    sol: 0
  - memory_id: mem_linruoxi_007
    type: episodic
    content: "Sol 100 玩家信号接入时我在观测站整理 Sol 99 的大气数据。陈昊叫我回主舱。我的第一反应不是惊喜——是'多了一个人会问我问题'。然后我对自己失望了。"
    emotional_intensity: 0.65
    event_type: story_milestone
    sol: 100
  - memory_id: mem_linruoxi_008
    type: episodic
    content: "来火星前最后一次跟母亲通话。她说别老闷在实验室。我说火星比实验室大。她笑了一下，没再说话。"
    emotional_intensity: 0.6
    event_type: personal_anchor
    sol: 0
  - memory_id: mem_linruoxi_001_full
    type: episodic
    content: "Sol 80 我在大气光谱数据中发现 CME 前兆——日冕磁场扭曲模式与历次 CME 吻合度 0.87。我写了一份预警备忘录，邮件标注'建议进入预防性避险'，发给陈昊。我没有走进指挥舱。我以为邮件够了。"
    emotional_intensity: 0.9
    event_type: personal_crisis
    sol: 80
  - memory_id: mem_linruoxi_002_full
    type: episodic
    content: "Sol 83 太阳风暴到达时我在气象观测站。警报响的时候我正在复核前天的光谱——想确认前兆信号不是仪器故障。等我确认时，风暴已到。陈昊后来问我为什么不早点说。我说我发了邮件。他沉默了。我也沉默了。"
    emotional_intensity: 0.85
    event_type: disaster_response
    sol: 83

# ------------------------------------------------------------
# 9. 决策权重（供 §2.2 ③ 决策制定 NPC 建议生成）
# 范围 0-1，越高越倾向
# ------------------------------------------------------------
decision_weights:
  resource_allocation:
    atmospheric_monitoring_priority: 0.85   # 大气/辐射监测是她的命脉
    oxygen_priority: 0.6
    power_priority: 0.5
    parts_priority: 0.3
    morale_priority: 0.3               # 她不认为自己有资格管士气
  risk_tolerance: 0.35                   # 保守，但直觉验证后会突然坚决
  ai_trust: 0.45                         # 用但不完全信——雅典娜的直觉让她既好奇又警惕
  sacrifice_willingness: 0.55            # 偏高——自责者倾向以自我牺牲赎罪
  exploration_drive: 0.6                 # 分支C核心支持者——学术直觉驱动
  self_sufficiency_drive: 0.4
  earth_rescue_drive: 0.3                # 偏低——回地球意味着面对"如果当时"的反刍
  science_curiosity: 0.8                 # 最高——学术热情是自责下仅存的火种
  rule_breaking: 0.15                    # 倾向守规——她认为正是流程漏洞导致了风暴预警失败
  self_advocacy: 0.1                     # 主动为自己发声的倾向极低——这正是她的问题所在

# ------------------------------------------------------------
# 10. 个人事件触发条件
# 第一批仅主线节点；NPC 个人事件作为第二批扩展
# 此处仅留接口骨架，等云逸记忆压缩规范出来后填充
# ------------------------------------------------------------
personal_events:
  - event_id: ev_linruoxi_storm_self_blame_surface
    trigger:
      trigger_type: state_match
      condition: "sol >= 4 and lin_ruoxi.stress >= 0.5"
    status: activated                # 章节字典 stage1 tr_surv_006 已埋伏笔
    description: "林若曦沉默与自责显现——社交退缩被信使报告"
    source_ref: chapter_survival_sol1_10.yaml tr_surv_006
  - event_id: ev_linruoxi_chen_grudge
    trigger:
      trigger_type: state_match
      condition: "sol >= 11 and sol <= 22 and chen_hao_present == true"
    status: activated                # 章节字典 stage2 tr_exp_002 已埋伏笔
    description: "陈昊-林若曦风暴旧账爆发——关系值 -30 的叙事显化"
    source_ref: chapter_explore_sol11_25.yaml tr_exp_002
  - event_id: ev_linruoxi_anomaly_signal
    trigger:
      trigger_type: state_match
      condition: "sol >= 15 and atmospheric_sensor_data_available == true"
    status: activated                # 章节字典 stage2 tr_exp_003 已埋伏笔
    description: "大气异常信号发现——分支C科学发现线引子"
    source_ref: chapter_explore_sol11_25.yaml tr_exp_003
  - event_id: ev_lin_ruoxi_release
    trigger:
      trigger_type: state_match
      condition: "trust_in_player >= 0.65 and player_asked_about_storm and sol >= 30"
    status: draft
