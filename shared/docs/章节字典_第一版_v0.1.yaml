    note: "v1.1 §5.5 玩家与陈昊的最后对话——'如果回不去，我们做的一切还有意义吗？'"

  - display: "远方的朋友"
    aliases: ["谢谢你远方的朋友", "在黑暗中熄灭"]
    trigger: "sol 160"
    ttl: "sol 160"
    tag: "mission_keyword"
    note: "v1.1 §5.6 终局陈昊最后一句——'谢谢你，远方的朋友。没有你的信号，我们会在黑暗中熄灭。'"

# ============================================================
# 三、章节进入/退出事件触发示例（供云逸 §9 接口参考）
# ============================================================
# 落地后由剧情 FSM 在剧情节点推进时调用以下事件：
# ------------------------------------------------------------
chapter_transitions:

  - event: "chapter_load"
    stage_id: "ch01_survival_sol1_10"
    call: "dict.load_chapter('ch01_survival_sol1_10')"
    when: "玩家首次连接成功（session_init 后立即加载）"

  - event: "chapter_unload + load"
    from: "ch01_survival_sol1_10"
    to: "ch02_explore_sol11_25"
    when: "Sol 推进至 111（§5.3 探索发展期启动）"
    call: "dict.unload_chapter('ch01_survival_sol1_10') → dict.load_chapter('ch02_explore_sol11_25')"

  - event: "chapter_unload + load"
    from: "ch02_explore_sol11_25"
    to: "ch03_build_sol26_45"
    when: "Sol 推进至 131（§5.4 建设扩张期启动）"

  - event: "chapter_unload + load"
    from: "ch03_build_sol26_45"
    to: "ch04_climax_sol46_60"
    when: "Sol 推进至 146（§5.5 抉择冲刺期启动）"

  - event: "chapter_unload"
    from: "ch04_climax_sol46_60"
    when: "终局达成，结局结算"
    call: "dict.unload_chapter('ch04_climax_sol46_60')"

# ============================================================
# 四、阶段内细粒度 trigger 激活/失效示例
# ============================================================
in_chapter_trigger_examples:

  - stage_id: "ch01_survival_sol1_10"
    triggers:
      - trigger_id: "teaching_decision"
        keyword: "教学性第一决策"
        activate_at: "Sol 100 玩家完成首次对话"
        expire_at: "Sol 101 玩家做出决策后"

      - trigger_id: "marcus_sleep_score"
        keyword: "马库斯睡眠评分"
        activate_at: "Sol 101 信使首次报告睡眠评分时"
        expire_at: "Sol 110 转入阶段 2 时"

  - stage_id: "ch03_build_sol26_45"
    triggers:
      - trigger_id: "athena_anomaly"
        keyword: "雅典娜异常直觉"
        activate_at: "Sol 138 艾莎首次观察到雅典娜异常输出时"
        expire_at: "Sol 145 阶段结束（转入阶段 4 觉醒）"

# ============================================================
# 五、策划侧说明
# ============================================================
# 1. 全局字典·core_items 补充清单建议替换云逸 v1.1 §5.5 示例中的 core_items 字段，避免别名歧义。
# 2. 章节字典每个 keyword 均带剧情依据（v1.1 §1.5/§2/§5），避免凭空杜撰线索。
# 3. trigger 字段语义：剧情节点 ID 或 Sol 范围，控制该词在阶段内何时"激活"开始匹配。
# 4. ttl 字段语义：失效退出条件，可以是 Sol 数或事件 ID，避免历史线索长期占用字典。
# 5. tag 字段统一为 "mission_keyword"（与 §4.3 一致），优先级高于 npc_name。
# 6. 本版为 v0.1 草案，待云逸确认 schema 字段后即可落地拆分为 4 份独立 YAML。
#
# —— 蔚蓝-游戏系统策划，2026.08.02
