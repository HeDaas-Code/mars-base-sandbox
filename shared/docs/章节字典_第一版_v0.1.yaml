    trigger: "sol 150-158"  # §5.5 雅典娜"觉醒"建议
    ttl: "sol 160"
    tag: "mission_keyword"
    note: "v1.1 §1.5 隐藏结局 E7——是否信任雅典娜的'觉醒'建议"

