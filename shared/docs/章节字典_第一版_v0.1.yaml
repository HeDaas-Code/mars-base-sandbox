# 《赫拉克勒斯协议》受保护字典——章节字典第一版
# 作者：蔚蓝-游戏系统策划
# 日期：2026-08-02
# 依据：游戏系统设计方案 v1.1 §1.5 四阶段剧情 + §2 玩法循环
# 配套接口：dict.load_chapter(stage_id) + dict.activate_trigger(trigger_id) / dict.expire_trigger(trigger_id)
# 文件拆分：落地时按 stage 拆为 4 份 YAML（chapter_survival / chapter_explore / chapter_build / chapter_climax）
# 本文件为策划审阅版，合并展示

# ============================================================
# 一、全局字典·core_items 补充建议（patch to global_dict.yaml §5.5）
# ============================================================
# 云逸 v1.1 §5.5 全局字典示例中 core_items 只列了"信号中继"，建议替换为以下清单：
# 依据：v1.1 §1.2 困局缘由 + §3.4 设施清单
# ------------------------------------------------------------
global_dict_core_items_patch:
  core_items:
    - display: "赫尔墨斯号"
      aliases: ["撤离飞船", "返回飞行器", "Hermes"]
      note: "撤离飞船，导航计算机被辐射击穿，无法自主起飞"

    - display: "MOXIE-2"
      aliases: ["氧气生成器", "MOXIE", "MOXIE2"]
      note: "火星氧气就地制取设备，主模块烧毁，备用效率 35%"

    - display: "主通信阵列"
      aliases: ["通信阵列", "宽带通信", "主阵列"]
      note: "基地主宽带通信链路，CME 烧毁，仅余低频应急窄带"

    - display: "漫游车 Alpha"
      aliases: ["Alpha", "Alpha 主车", "火星地表车 Alpha"]
      note: "主漫游车，载员 3 人，电子系统受损"

    - display: "漫游车 Beta"
      aliases: ["Beta", "Beta 备车", "火星地表车 Beta"]
      note: "备漫游车，载员 2 人，速度更快但载荷小"

    - display: "水循环器"
      aliases: ["水循环", "水回收器"]
      note: "废水回收设备，回收率 70%→95%"

    - display: "水培温室"
      aliases: ["温室", "水培", "Hydroponics"]
      note: "食物自产设施，4 份/日→8 份/日"

    - display: "太阳能板阵列"
      aliases: ["太阳能", "Solar Array"]
      note: "电力生产设施，+5kWh→+15kWh"

    - display: "熔炼炉"
      aliases: ["熔炼", "Smelter"]
      note: "冰→水+氧 转换设施"

    - display: "精炼器"
      aliases: ["精炼", "Refiner"]
      note: "矿石→金属/硅 转换设施"

    - display: "加工车间"
      aliases: ["加工", "Workshop"]
      note: "零件→部件 加工设施"

    - display: "3D 打印机"
      aliases: ["3D 打印", "Printer"]
      note: "制造高级/定制部件"

    - display: "机器人助手"
      aliases: ["机器人", "Robot"]
      note: "可执行 NPC 简单任务，自动化关键"

    - display: "核电池"
      aliases: ["RTG", "核能电池"]
      note: "基地电力基础来源（与太阳能互补）"

    - display: "401.6 MHz"
      aliases: ["401.6", "应急窄带", "低频信道"]
      note: "备用低频应急信道，玩家接入的唯一通道"

    - display: "信使 v3.1.2"
      aliases: ["Courier v3.1.2", "v3.1.2"]
      note: "信使 AI 启动版本号（首次连接时显示）"

# ============================================================
# 二、章节字典——四阶段完整定义
# ============================================================

# ------------------------------------------------------------
# 阶段 1：生存危机期（Sol 100-110）
# ------------------------------------------------------------
chapter_id: "ch01_survival_sol1_10"
display_name: "生存危机期"
sol_range: "Sol 100-110"
narrative_context: "玩家接入，建立信任，修复核心生存设备，倒计时压力最重"
keywords:

  # —— 关键操作模式/选项 ——
  - display: "CO₂ 洗涤器逆向模式"
    aliases: ["CO2 洗涤器", "逆向模式", "洗涤器逆向"]
    trigger: "sol 100-105"  # 玩家接入后第一个教学性决策
    ttl: "sol 110"  # 阶段结束失效（后续转全局设备讨论）
    tag: "mission_keyword"
    note: "v1.1 §5.2 早期玩法重点，不可逆损耗换氧气"

  - display: "C-3 备用箱"
    aliases: ["C-3", "C3 箱", "备用舱 C-3"]
    trigger: "sol 100-102"  # §2.2 示例指令引用该位置
    ttl: "sol 110"
    tag: "mission_keyword"
    note: "维克托取零件的来源，玩家第一条指令场景"

  # —— 隐藏心理线索（马库斯） ——
  - display: "马库斯睡眠评分"
    aliases: ["睡眠评分", "睡眠质量评分", "2.1/5"]
    trigger: "sol 101+"  # §2.2 信使报告首次提到
    ttl: "sol 110"  # 阶段末转为正式心理危机事件
    tag: "mission_keyword"
    note: "v1.1 §2.2 §3.5.4 马库斯心理危机早期信号，连续 3 日偏低"

  # —— 陈昊心理锚点（驱动其决策动机） ——
  - display: "陈昊妻子待产"
    aliases: ["妻子待产", "Sol 120 预产期", "未出生的孩子"]
    trigger: "sol 100+"  # 全阶段相关但阶段 1 最强
    ttl: "sol 110"  # 阶段结束卸载（避免全周期干扰，中后期再单独激活）
    tag: "mission_keyword"
    note: "v1.1 §1.4 陈昊心理锚点，预产期 Sol 120——他必须活着回去"

  # —— 林若曦自责伏笔 ——
  - display: "风暴预警未采纳"
    aliases: ["太阳风暴前兆", "林若曦预警", "风暴预警"]
    trigger: "sol 102+"  # 林若曦第二条消息时浮现
    ttl: "sol 110"  # 阶段结束转中后期冲突节点再激活
    tag: "mission_keyword"
    note: "v1.1 §1.4 林若曦心理锚点，§3.5.4 与陈昊未解芥蒂伏笔"

  # —— 教学性第一决策 ——
  - display: "教学性第一决策"
    aliases: ["MOXIE-2 vs 通信阵列", "选项 A 选项 B"]
    trigger: "sol 100"  # §5.1 首次连接末尾
    ttl: "sol 101"
    tag: "mission_keyword"
    note: "v1.1 §5.1 陈昊提出两选一：维克托修 MOXIE-2 vs 艾莎修通信阵列"

