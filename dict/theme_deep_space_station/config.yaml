# ============================================================
# 题材包配置：深空科考站（最小示例）
# 引擎化 Phase 3.6 - 多题材验证
# 作者：锐锋-核心开发工程师  日期：2026-08-09
# ============================================================

# ------------------------------------------------------------
# 状态字段 schema（题材特定字段）
# ------------------------------------------------------------
state_schema:
  fields:
    - {name: signal_anomaly_count, type: int, default: 0, description: "检测到的异常信号次数"}
    - {name: reactor_status, type: str, default: "stable", description: "反应堆状态（stable/unstable/critical）"}
    - {name: contact_established, type: bool, default: false, description: "是否与异常信号源建立联系"}
    - {name: evacuation_armed, type: bool, default: false, description: "撤离程序是否就绪"}

# ------------------------------------------------------------
# 资源定义
# ------------------------------------------------------------
resources:
  - {name: oxygen, max: 100, rate: -0.2, threshold: 20, owner: engineer, initial: 92}
  - {name: power, max: 100, rate: 0.3, threshold: 15, owner: engineer, initial: 88}
  - {name: fuel, max: 50, rate: 0, threshold: 5, owner: commander, initial: 30}

# ------------------------------------------------------------
# 结局注册表
# ------------------------------------------------------------
endings:
  - id: DSS_contact
    display_name: 第一次接触
    condition: 'contact_established == true'
    priority: 0
  - id: DSS_evacuation
    display_name: 紧急撤离
    condition: 'evacuation_armed == true and reactor_status == "critical"'
    priority: 10
  - id: DSS_meltdown
    display_name: 反应堆熔毁
    condition: 'reactor_status == "critical" and evacuation_armed == false'
    priority: 20
  - id: DSS_suffocation
    display_name: 窒息
    condition: "oxygen <= 0"
    priority: 30

# ------------------------------------------------------------
# Meta 命令注册表
# ------------------------------------------------------------
commands:
  - {name: sol, handler: advance_sol, help: "推进一个值班周期"}
  - {name: state, handler: show_state, help: "查看科考站状态"}
  - {name: npc, handler: switch_npc, help: "切换对话目标", aliases: [talk]}
  - {name: help, handler: show_help, help: "显示此帮助", aliases: ["?"]}

# ------------------------------------------------------------
# 信号质量配置
# ------------------------------------------------------------
signal_quality:
  initial: 75
  min: 30
  max: 99
