services:
  - type: web
    name: mars-base-sandbox-backend
    runtime: python
    plan: free
    region: singapore
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python ws_server.py --host 0.0.0.0 --port ${PORT:-8000}"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PORT
        value: "8000"
