name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main, engine-refactor]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup WebSocket URL
        env:
          WS_URL: ${{ vars.WS_URL || 'wss://mars-base-sandbox-backend.onrender.com/ws' }}
        run: |
          echo "Using WebSocket URL: ${WS_URL}"
          sed -i "s|ws://localhost:8000/ws|${WS_URL}|g" frontend/ws/client.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
