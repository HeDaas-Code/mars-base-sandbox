name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main, engine-refactor, deploy]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup WebSocket URL
        env:
          WS_URL: ${{ vars.WS_URL || 'wss://mars-base-sandbox-backend.onrender.com/ws' }}
        run: |
          echo "Using WebSocket URL: ${WS_URL}"
          sed -i "s|wss://BACKEND_URL/ws|${WS_URL}|g" frontend/ws/client.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
